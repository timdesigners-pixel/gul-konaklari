<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Muhasebe | Gül Konakları</title>
<link rel="icon" type="image/svg+xml" href="/gul-konaklari-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--panel:#fff;--panel2:#efece4;--ink:#18231f;--muted:#5f6a63;--line:#e0dcd1;--gold:#8d6f37;--accent:#173a30;--accent-ink:#fff;--bad:#b3362b;--good:#21744f}
:root[data-theme=dark]{--bg:#0b1110;--panel:#141d1a;--panel2:#1b2622;--ink:#edf1ee;--muted:#a3afa8;--line:#2a3732;--gold:#d9bb80;--accent:#d9bb80;--accent-ink:#14201b;--bad:#f0877c;--good:#6fd0a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif}
a{color:inherit}button,input,select{font:inherit;color:var(--ink)}
.wrap{width:min(1240px,calc(100% - 32px));margin:auto}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.head{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand img{width:38px;height:38px}.brand b{font:600 19px 'Playfair Display',serif;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:11px}.actions{display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;overflow-x:auto}nav button{border:0;border-bottom:2px solid transparent;background:none;padding:10px 13px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}nav button[aria-selected=true]{color:var(--ink);border-color:var(--gold)}
main{padding:24px 0 60px}h1{font:600 28px 'Playfair Display',serif;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.lead{color:var(--muted);margin:0 0 18px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.btn.small{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}.filters label,.field{display:grid;gap:3px;color:var(--muted);font-size:12px;font-weight:600}input,select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}.grow{flex:1 1 220px}.grow input,.grow select{width:100%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--panel2);font-size:12px;color:var(--muted);white-space:nowrap}tbody tr:last-child td{border-bottom:0}tfoot td{background:var(--panel2);font-weight:700}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.nowrap{white-space:nowrap}.rowlink{cursor:pointer}.rowlink:hover td{background:var(--panel2)}.debt{color:var(--bad)}.credit{color:var(--good)}
.status{min-height:21px;margin:8px 0;color:var(--muted)}.status.err{color:var(--bad)}.status.ok{color:var(--good)}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--muted)}
.login{max-width:400px;margin:8vh auto}.login .field{margin-bottom:12px}.login input{width:100%}.hidden{display:none!important}.line{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 36px;gap:8px;margin-bottom:8px}.line select{width:100%}.line input{width:100%;text-align:right}progress{width:100%;height:10px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.brand small{display:none}.line{grid-template-columns:1fr 1fr 36px}.line select{grid-column:1/-1}}
</style>
<link rel="stylesheet" href="/panel-theme.css">
</head>
<body class="gk-panel gk-ledger">
<header><div class="wrap"><div class="head"><a class="brand" href="/"><span class="mark">G</span><span><b>GÜL KONAKLARI</b><small>Muhasebe yönetimi</small></span></a><div class="actions"><button class="btn alt small" id="theme">Tema</button><button class="btn alt small hidden" id="logout">Çıkış</button></div></div>
<nav id="tabs" class="hidden" role="tablist"></nav></div></header>
<main class="wrap">
<section id="login" class="card login hidden"><h1>Yönetici girişi</h1><p class="lead">Muhasebe kayıtları yalnızca yetkili hesaplara açıktır.</p><form id="login-form"><label class="field">E-posta<input id="email" type="email" autocomplete="username" required></label><label class="field">Şifre<input id="password" type="password" autocomplete="current-password" required></label><button class="btn">Giriş yap</button></form><div class="status" id="login-status" role="status"></div></section>
<section id="app" class="hidden"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
const sb=window.supabase.createClient('https://btyqnudxqlbebndxfjgl.supabase.co','sb_publishable_JRKSFPqA3ecU3zVknp4kDw_BhP2nL6L');
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0));
const trDate=d=>d?d.split('-').reverse().join('.'):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const bal=n=>`<span class="${Number(n)>0?'debt':Number(n)<0?'credit':''}">${money(n)}</span>`;
const TABS=[['ozet','Özet'],['daireler','Daireler'],['ekstre','Hesap Ekstresi'],['mizan','Mizan'],['yevmiye','Yevmiye'],['fis','Yeni Fiş'],['aktarim','Veri Aktarımı']];
let accounts=[],apartments=[],activeTab='ozet',statementAccount='';

(function theme(){const r=document.documentElement;try{r.dataset.theme=localStorage.getItem('gul-konaklari-theme')==='light'?'light':'dark'}catch(e){}$('#theme').onclick=()=>{r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('gul-konaklari-theme',r.dataset.theme)}catch(e){}}})();

function downloadCsv(name,rows){const body=rows.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+body],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const csvNum=n=>Number(n||0).toFixed(2).replace('.',',');
async function fetchAll(build){const out=[];for(let from=0;;from+=1000){const {data,error}=await build().range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)return out}}
async function loadBase(){const [a,b]=await Promise.all([fetchAll(()=>sb.from('ledger_trial_balance').select('*').order('code')),fetchAll(()=>sb.from('apartments').select('id,block,apartment_no').neq('block','TEST'))]);accounts=a.sort((x,y)=>x.code.localeCompare(y.code,'tr',{numeric:true}));apartments=b}
const sum=(rows,k)=>rows.reduce((t,r)=>t+Math.round(Number(r[k]||0)*100),0)/100;
const mainSum=(...codes)=>sum(accounts.filter(a=>codes.includes(a.main_code)),'balance');

async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}const {data:roles,error}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).is('revoked_at',null).in('role',['manager','accounting']);if(error||!roles?.length){await sb.auth.signOut();showLogin('Bu hesapta muhasebe yetkisi bulunamadı.');return}$('#login').classList.add('hidden');app.classList.remove('hidden');$('#tabs').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#tabs').innerHTML=TABS.map(([id,t])=>`<button role="tab" data-tab="${id}">${t}</button>`).join('');$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)};await refresh()}
function showLogin(msg=''){$('#login').classList.remove('hidden');app.classList.add('hidden');$('#tabs').classList.add('hidden');$('#logout').classList.add('hidden');$('#login-status').textContent=msg;$('#login-status').className='status'+(msg?' err':'')}
$('#login-form').onsubmit=async e=>{e.preventDefault();$('#login-status').textContent='Kontrol ediliyor…';const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#password').value='';if(error){$('#login-status').textContent='Giriş başarısız. Bilgilerinizi kontrol edin.';$('#login-status').className='status err';return}await boot()};
$('#logout').onclick=async()=>{await sb.auth.signOut();accounts=[];app.innerHTML='';showLogin()};
const params=new URLSearchParams(location.search);if(params.get('embed')){document.documentElement.dataset.theme='dark';$('.head').classList.add('hidden');$('#theme').classList.add('hidden')}if(params.get('account')){statementAccount=params.get('account');activeTab='ekstre'}else if(params.get('embed'))activeTab='fis';
async function refresh(){app.innerHTML='<div class="status">Kayıtlar yükleniyor…</div>';try{await loadBase();go(accounts.some(a=>a.entry_count>0)?activeTab:'aktarim')}catch(e){app.innerHTML=`<div class="status err">Kayıtlar yüklenemedi: ${esc(e.message)}</div>`}}
function go(tab){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));({ozet:viewSummary,daireler:viewApartments,ekstre:viewStatement,mizan:viewTrial,yevmiye:viewJournal,fis:viewVoucher,aktarim:viewImport})[tab]();window.scrollTo(0,0)}

function viewSummary(){const groups=[['100','Kasa'],['102','Banka'],['109','Sanal POS'],['134','Daire alacakları'],['320','Satıcılar'],['335','Personel'],['600','Aidat gelirleri'],['602','Diğer gelirler']];const rows=accounts.filter(a=>a.main_code==='134'&&a.balance>0);const d=sum(accounts,'debit'),c=sum(accounts,'credit');app.innerHTML=`<h1>Genel durum</h1><p class="lead">Tüm tutarlar defterdeki güncel kayıtlardan hesaplanır.</p><div class="stats">${groups.map(([k,t])=>`<div class="stat"><small>${k} · ${t}</small><b>${money(Math.abs(mainSum(k)))}</b></div>`).join('')}</div><div class="card"><h2>Defter kontrolü</h2><p>Toplam borç <b>${money(d)}</b>, toplam alacak <b>${money(c)}</b>. ${d===c?'<span class="credit">Defter dengede.</span>':'<span class="debt">Defter dengesiz, kontrol edin.</span>'}</p><p>Borçlu daire hesabı: <b>${rows.length}</b>, toplam açık bakiye: <b>${money(mainSum('134'))}</b>.</p></div>`}

function apartmentRows(){const by=new Map();for(const a of accounts.filter(x=>x.main_code==='134'&&x.apartment_id)){const r=by.get(a.apartment_id)||{list:[],balance:0};r.list.push(a);r.balance=Math.round((r.balance+Number(a.balance))*100)/100;by.set(a.apartment_id,r)}return apartments.map(p=>({...p,...(by.get(p.id)||{list:[],balance:0})})).sort((a,b)=>a.block.localeCompare(b.block,'tr')||Number(a.apartment_no)-Number(b.apartment_no))}
function viewApartments(){const all=apartmentRows();app.innerHTML=`<h1>Daireler</h1><p class="lead">${all.length} daire. Hesabı açmak için satıra tıklayın.</p><div class="filters"><label class="grow">Ara<input id="q" placeholder="Blok, daire veya kişi"></label><label>Durum<select id="st"><option value="">Tümü</option><option value="debt">Borçlu</option><option value="credit">Alacaklı</option><option value="zero">Sıfır</option></select></label><button class="btn alt" id="csv">CSV indir</button></div><div class="tablewrap"><table><thead><tr><th>Daire</th><th>Hesaplar</th><th class="num">Bakiye (TL)</th></tr></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div>`;let shown=[];const draw=()=>{const q=$('#q').value.toLocaleLowerCase('tr'),st=$('#st').value;shown=all.filter(r=>(!q||`${r.block}/${r.apartment_no} ${r.list.map(x=>x.name).join(' ')}`.toLocaleLowerCase('tr').includes(q))&&(!st||(st==='debt'&&r.balance>0)||(st==='credit'&&r.balance<0)||(st==='zero'&&r.balance===0)));$('#rows').innerHTML=shown.map(r=>`<tr class="rowlink" tabindex="0" data-acc="${esc(r.list[0]?.account_id||'')}"><td class="nowrap"><b>${esc(r.block)}/${esc(r.apartment_no)}</b></td><td>${r.list.map(x=>`<a href="#" data-acc="${esc(x.account_id)}">${esc(x.name)}</a> · ${money(x.balance)}`).join('<br>')||'—'}</td><td class="num">${bal(r.balance)}</td></tr>`).join('')||'<tr><td colspan="3">Kayıt bulunamadı.</td></tr>';$('#foot').innerHTML=`<tr><td colspan="2">${shown.length} daire</td><td class="num">${money(sum(shown,'balance'))}</td></tr>`};$('#q').oninput=draw;$('#st').onchange=draw;const open=e=>{const t=e.target.closest('[data-acc]');if(t?.tagName==='A')e.preventDefault();if(t?.dataset.acc){statementAccount=t.dataset.acc;go('ekstre')}};$('#rows').onclick=open;$('#rows').onkeydown=e=>{if(e.key==='Enter')open(e)};$('#csv').onclick=()=>downloadCsv('daire-bakiyeleri.csv',[['Blok','Daire','Hesaplar','Bakiye'],...shown.map(r=>[r.block,r.apartment_no,r.list.map(x=>x.name).join(' | '),csvNum(r.balance)])]);draw()}

const accountOptions=sel=>accounts.map(a=>`<option value="${a.account_id}" ${a.account_id===sel?'selected':''}>${esc(a.code)} · ${esc(a.name)}</option>`).join('');
function viewStatement(){if(!statementAccount&&accounts[0])statementAccount=accounts[0].account_id;app.innerHTML=`<h1>Hesap ekstresi</h1><p class="lead">Seçili hesabın tüm hareketleri ve yürüyen bakiyesi.</p><div class="filters"><label class="grow">Hesap<select id="acc">${accountOptions(statementAccount)}</select></label><label>Başlangıç<input id="from" type="date"></label><label>Bitiş<input id="to" type="date"></label><button class="btn alt" id="csv">CSV indir</button></div><div class="status" id="st" role="status"></div><div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Fiş</th><th>Hareket</th><th>Açıklama</th><th class="num">Borç</th><th class="num">Alacak</th><th class="num">Bakiye</th></tr></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div>`;let rows=[];const load=async()=>{statementAccount=$('#acc').value;$('#st').textContent='Yükleniyor…';$('#rows').innerHTML='';$('#foot').innerHTML='';try{rows=await fetchAll(()=>{let q=sb.from('ledger_active_entries').select('journal_no,entry_date,movement,description,debit,credit,running_balance').eq('account_id',statementAccount);if($('#from').value)q=q.gte('entry_date',$('#from').value);if($('#to').value)q=q.lte('entry_date',$('#to').value);return q.order('entry_date').order('source').order('source_row').order('created_at').order('id')});$('#st').textContent=rows.length+' hareket';$('#rows').innerHTML=rows.map(r=>`<tr><td class="nowrap">${trDate(r.entry_date)}</td><td class="nowrap">${esc(r.journal_no)}</td><td class="nowrap">${esc(r.movement)}</td><td>${esc(r.description)}</td><td class="num">${money(r.debit)}</td><td class="num">${money(r.credit)}</td><td class="num">${bal(r.running_balance)}</td></tr>`).join('')||'<tr><td colspan="7">Hareket bulunamadı.</td></tr>';$('#foot').innerHTML=`<tr><td colspan="4">Dönem toplamı</td><td class="num">${money(sum(rows,'debit'))}</td><td class="num">${money(sum(rows,'credit'))}</td><td class="num">${rows.length?money(rows[rows.length-1].running_balance):''}</td></tr>`}catch(e){$('#st').textContent='Yüklenemedi: '+e.message;$('#st').className='status err'}};['acc','from','to'].forEach(i=>$('#'+i).onchange=load);$('#csv').onclick=()=>{const a=accounts.find(x=>x.account_id===statementAccount);downloadCsv(`ekstre-${a?.code||'hesap'}.csv`,[['Tarih','Fiş','Hareket','Açıklama','Borç','Alacak','Bakiye'],...rows.map(r=>[trDate(r.entry_date),r.journal_no,r.movement,r.description,csvNum(r.debit),csvNum(r.credit),csvNum(r.running_balance)])])};load()}

function viewTrial(){app.innerHTML=`<h1>Mizan</h1><p class="lead">Ana hesap ve alt hesap bazında borç, alacak ve bakiye.</p><div class="filters"><label class="grow">Ara<input id="q" placeholder="Kod veya hesap adı"></label><label>Görünüm<select id="mode"><option value="main">Ana hesaplar</option><option value="all">Tüm alt hesaplar</option></select></label><button class="btn alt" id="csv">CSV indir</button></div><div class="tablewrap"><table><thead><tr><th>Kod</th><th>Hesap</th><th class="num">Borç</th><th class="num">Alacak</th><th class="num">Bakiye</th></tr></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div>`;let shown=[];const names={100:'Kasa',102:'Bankalar',109:'Sanal POS',134:'Daire hesapları',320:'Satıcılar',335:'Personele borçlar',600:'Aidat gelirleri',602:'Diğer gelirler',690:'Dönem sonucu',810:'Finansman giderleri'};const draw=()=>{const q=$('#q').value.toLocaleLowerCase('tr');if($('#mode').value==='main'){const m=new Map();for(const a of accounts){const r=m.get(a.main_code)||{code:a.main_code,name:names[a.main_code]||'Ana hesap',debit:0,credit:0,balance:0};for(const k of ['debit','credit','balance'])r[k]=Math.round((r[k]+Number(a[k]))*100)/100;m.set(a.main_code,r)}shown=[...m.values()]}else shown=accounts;shown=shown.filter(r=>!q||`${r.code} ${r.name}`.toLocaleLowerCase('tr').includes(q));$('#rows').innerHTML=shown.map(r=>`<tr ${r.account_id?`class="rowlink" data-acc="${r.account_id}"`:''}><td class="nowrap">${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${money(r.debit)}</td><td class="num">${money(r.credit)}</td><td class="num">${money(r.balance)}</td></tr>`).join('')||'<tr><td colspan="5">Kayıt bulunamadı.</td></tr>';$('#foot').innerHTML=`<tr><td colspan="2">Toplam</td><td class="num">${money(sum(shown,'debit'))}</td><td class="num">${money(sum(shown,'credit'))}</td><td class="num">${money(sum(shown,'balance'))}</td></tr>`};$('#q').oninput=draw;$('#mode').onchange=draw;$('#rows').onclick=e=>{const t=e.target.closest('[data-acc]');if(t){statementAccount=t.dataset.acc;go('ekstre')}};$('#csv').onclick=()=>downloadCsv('mizan.csv',[['Kod','Hesap','Borç','Alacak','Bakiye'],...shown.map(r=>[r.code,r.name,csvNum(r.debit),csvNum(r.credit),csvNum(r.balance)])]);draw()}

function viewJournal(){let page=0;const size=50;app.innerHTML=`<h1>Yevmiye</h1><p class="lead">Tüm hareketler. Aktarılan kayıtlar değiştirilemez, manuel fişler ters kayıtla düzeltilir.</p><div class="filters"><label class="grow">Açıklama<input id="q" placeholder="Açıklamada ara"></label><label>Fiş no<input id="no"></label><label>Başlangıç<input id="from" type="date"></label><label>Bitiş<input id="to" type="date"></label><label>Kaynak<select id="src"><option value="">Tümü</option><option value="bulut">Aktarılan</option><option value="manual">Manuel</option></select></label></div><div class="status" id="st" role="status"></div><div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Fiş</th><th>Hesap</th><th>Hareket</th><th>Açıklama</th><th class="num">Borç</th><th class="num">Alacak</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button class="btn alt small" id="prev">Önceki</button><span id="info"></span><button class="btn alt small" id="next">Sonraki</button></div>`;let timer;const load=async()=>{$('#st').textContent='Yükleniyor…';$('#st').className='status';let q=sb.from('ledger_active_entries').select('journal_no,entry_date,account_code,account_name,movement,description,debit,credit,source,reversal_of',{count:'exact'});const text=$('#q').value.trim(),no=$('#no').value.trim();if(text)q=q.ilike('description','%'+text.replace(/[\\%_]/g,'\\$&')+'%');if(no)q=q.eq('journal_no',no);if($('#from').value)q=q.gte('entry_date',$('#from').value);if($('#to').value)q=q.lte('entry_date',$('#to').value);if($('#src').value)q=q.eq('source',$('#src').value);const {data,count,error}=await q.order('entry_date',{ascending:false}).order('journal_no',{ascending:false}).order('id').range(page*size,page*size+size-1);if(error){$('#st').textContent='Yüklenemedi: '+error.message;$('#st').className='status err';return}$('#st').textContent='';const pages=Math.max(1,Math.ceil((count||0)/size));$('#info').textContent=`Sayfa ${page+1} / ${pages} · ${count||0} satır`;$('#prev').disabled=page===0;$('#next').disabled=page+1>=pages;$('#rows').innerHTML=data.map(r=>`<tr><td class="nowrap">${trDate(r.entry_date)}</td><td class="nowrap">${esc(r.journal_no)}</td><td><b>${esc(r.account_code)}</b><br>${esc(r.account_name)}</td><td class="nowrap">${esc(r.movement)}</td><td>${esc(r.description)}</td><td class="num">${money(r.debit)}</td><td class="num">${money(r.credit)}</td><td>${r.source==='manual'&&!r.reversal_of?`<button class="btn alt small" data-rev="${esc(r.journal_no)}">Ters kayıt</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">Kayıt bulunamadı.</td></tr>'};const reset=()=>{page=0;load()};$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(reset,350)};$('#no').oninput=$('#q').oninput;['from','to','src'].forEach(i=>$('#'+i).onchange=reset);$('#prev').onclick=()=>{page--;load()};$('#next').onclick=()=>{page++;load()};$('#rows').onclick=async e=>{const b=e.target.closest('[data-rev]');if(!b||!confirm(`${b.dataset.rev} numaralı fiş için bugünün tarihiyle ters kayıt oluşturulsun mu?`))return;b.disabled=true;const {data,error}=await sb.rpc('reverse_manual_journal',{p_journal_no:b.dataset.rev,p_date:today()});if(error){$('#st').textContent=error.message;$('#st').className='status err';b.disabled=false;return}await loadBase();await load();$('#st').textContent=`Ters kayıt oluşturuldu: ${data}`;$('#st').className='status ok'};load()}

function viewVoucher(){app.innerHTML=`<h1>Yeni fiş</h1><p class="lead">Tahsilat, gider, virman ve düzeltmeler çift taraflı kaydedilir. Borç ve alacak eşit olmalıdır.</p><form class="card" id="f"><div class="filters"><label>Tarih<input id="date" type="date" value="${today()}" required></label><label class="grow">Açıklama<input id="desc" maxlength="300" required></label></div><div id="lines"></div><button type="button" class="btn alt small" id="add">Satır ekle</button><p>Borç <b id="td">0,00</b> · Alacak <b id="tc">0,00</b> · Fark <b id="diff">0,00</b></p><button class="btn" id="save" disabled>Fişi kaydet</button><div class="status" id="st" role="status"></div></form>`;const addLine=()=>{const d=document.createElement('div');d.className='line';d.innerHTML=`<select aria-label="Hesap" required><option value="">Hesap seçin</option>${accountOptions()}</select><input aria-label="Borç" inputmode="decimal" placeholder="Borç"><input aria-label="Alacak" inputmode="decimal" placeholder="Alacak"><button type="button" class="btn alt small" aria-label="Satırı sil">×</button>`;$('#lines').append(d);d.querySelector('button').onclick=()=>{if($('#lines').children.length>2){d.remove();calc()}}};const parse=v=>{v=v.trim();if(!v)return 0;if(!/^\d{1,3}(\.\d{3})*(,\d{1,2})?$|^\d+([.,]\d{1,2})?$/.test(v))return NaN;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');return Math.round(Number(v)*100)/100};const read=()=>[...$('#lines').children].map(l=>({account_id:l.querySelector('select').value,debit:parse(l.children[1].value),credit:parse(l.children[2].value)}));const calc=()=>{const r=read(),td=sum(r,'debit'),tc=sum(r,'credit'),ok=r.length>=2&&td>0&&td===tc&&r.every(x=>x.account_id&&(x.debit>0)!==(x.credit>0)&&!isNaN(x.debit)&&!isNaN(x.credit));$('#td').textContent=isNaN(td)?'—':money(td);$('#tc').textContent=isNaN(tc)?'—':money(tc);$('#diff').textContent=isNaN(td-tc)?'—':money(td-tc);$('#save').disabled=!ok};addLine();addLine();$('#add').onclick=addLine;$('#f').oninput=calc;$('#f').onchange=calc;$('#f').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;const {data,error}=await sb.rpc('post_manual_journal',{p_date:$('#date').value,p_description:$('#desc').value,p_lines:read()});if(error){$('#st').textContent=error.message;$('#st').className='status err';calc();return}await loadBase();viewVoucher();$('#st').textContent=`Fiş kaydedildi: ${data}`;$('#st').className='status ok'}}

function parseWorkbook(buffer){const files=fflate.unzipSync(new Uint8Array(buffer),{filter:f=>f.name==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet1\.xml$/.test(f.name)});const dec=new TextDecoder(),xml=n=>{if(!files[n])throw new Error('Excel içeriği okunamadı');const d=new DOMParser().parseFromString(dec.decode(files[n]),'application/xml');if(d.querySelector('parsererror'))throw new Error('Excel içeriği bozuk');return d};const strings=[...xml('xl/sharedStrings.xml').documentElement.children].map(x=>x.textContent);const rows=[...xml('xl/worksheets/sheet1.xml').getElementsByTagName('row')];const num=v=>{if(v===''||v==null)return 0;const n=Number(v);if(!Number.isFinite(n))throw new Error('Geçersiz tutar');return Math.round(n*100)/100};const iso=v=>{const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(v.trim());if(!m)throw new Error('Geçersiz tarih: '+v);return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`};const acc=new Map(),entries=[];let cur=null;rows.forEach((row,idx)=>{const c={};for(const cell of row.getElementsByTagName('c')){const col=cell.getAttribute('r').replace(/\d/g,'');const raw=cell.getElementsByTagName('v')[0]?.textContent??cell.textContent??'';c[col]=cell.getAttribute('t')==='s'?(strings[Number(raw)]??''):raw}if(idx===0){if(!/Yevmiye/i.test(c.A||''))throw new Error('Bu dosya Toplu Muavin Dökümü değil');return}if((c.C||'').trim()){cur=c.C.trim();acc.set(cur,(c.E||'').trim());return}if(!(c.A||'').trim()||!(c.B||'').trim()||!cur)return;entries.push({journal_no:c.A.trim(),code:cur,entry_date:iso(c.B),movement:(c.D||'').trim(),description:(c.E||'').trim(),debit:num(c.F),credit:num(c.G),source_row:idx+1})});return{accounts:[...acc].map(([code,name])=>({code,name})),entries}}
function viewImport(){app.innerHTML=`<h1>Veri aktarımı</h1><p class="lead">Bulutyönetim'den indirilen <b>Toplu Muavin Dökümü</b> Excel dosyasını seçin. Dosya önce kontrol edilir, onayınızdan sonra aktarılır.</p><div class="card"><label class="field">Excel dosyası<input id="file" type="file" accept=".xlsx"></label><div class="status" id="st" role="status"></div><div id="preview"></div><progress id="bar" class="hidden" max="100" value="0"></progress></div>`;let parsed=null,hash='',fileName='';$('#file').onchange=async e=>{const f=e.target.files[0];parsed=null;$('#preview').innerHTML='';if(!f)return;$('#st').className='status';$('#st').textContent='Dosya kontrol ediliyor…';try{if(f.size>25*1024*1024)throw new Error('Dosya çok büyük');const b=await f.arrayBuffer();hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');fileName=f.name;parsed=parseWorkbook(b);const d=sum(parsed.entries,'debit'),c=sum(parsed.entries,'credit');const j=new Map();parsed.entries.forEach(x=>{const r=j.get(x.journal_no)||[0,0];r[0]+=Math.round(x.debit*100);r[1]+=Math.round(x.credit*100);j.set(x.journal_no,r)});const bad=[...j.values()].filter(r=>r[0]!==r[1]).length;const close134=Math.round(parsed.entries.filter(x=>x.code.startsWith('134.')).reduce((t,x)=>t+Math.round(x.debit*100)-Math.round(x.credit*100),0))/100;const ok=d===c&&bad===0&&parsed.entries.length>0;$('#st').textContent=ok?'Dosya geçerli.':'Dosya dengesiz, aktarılamaz.';$('#st').className='status '+(ok?'ok':'err');$('#preview').innerHTML=`<div class="stats"><div class="stat"><small>Hesap</small><b>${parsed.accounts.length}</b></div><div class="stat"><small>Hareket</small><b>${parsed.entries.length}</b></div><div class="stat"><small>Borç = Alacak</small><b>${money(d)}</b></div><div class="stat"><small>Daire bakiyesi</small><b>${money(close134)}</b></div></div>${ok?'<button class="btn" id="go">Kontrol ettim, aktar</button>':''}`;if(ok)$('#go').onclick=()=>runImport(parsed,hash,fileName,d)}catch(err){$('#st').textContent='Dosya okunamadı: '+err.message;$('#st').className='status err'}}}
async function runImport(p,hash,fileName,debit){const st=$('#st'),bar=$('#bar');$('#go').disabled=true;$('#file').disabled=true;bar.classList.remove('hidden');const fail=m=>{st.textContent='Aktarım durdu: '+m+' Mevcut kayıtlar değişmedi.';st.className='status err';$('#file').disabled=false};try{const {data:{user}}=await sb.auth.getUser();const {data:old,error:oe}=await sb.from('import_batches').select('id,status').eq('file_hash',hash).maybeSingle();if(oe)throw oe;if(old?.status==='committed'){fail('Bu dosya daha önce aktarılmış.');return}if(old){const {error}=await sb.from('import_batches').delete().eq('id',old.id);if(error)throw error}st.className='status';st.textContent='Hesaplar hazırlanıyor…';const known=new Map((await fetchAll(()=>sb.from('ledger_accounts').select('id,code').order('code'))).map(a=>[a.code,a.id]));const fresh=p.accounts.filter(a=>!known.has(a.code));for(let i=0;i<fresh.length;i+=200){const {data,error}=await sb.from('ledger_accounts').insert(fresh.slice(i,i+200)).select('id,code');if(error)throw error;data.forEach(a=>known.set(a.code,a.id))}const {data:batch,error:be}=await sb.from('import_batches').insert({file_name:fileName,file_hash:hash,imported_by:user.id,status:'pending',total_rows:p.entries.length,summary:{kind:'ledger'}}).select('id').single();if(be)throw be;const rows=p.entries.map(({code,...x})=>({...x,batch_id:batch.id,account_id:known.get(code),source:'bulut',created_by:user.id}));for(let i=0;i<rows.length;i+=500){const {error}=await sb.from('ledger_entries').insert(rows.slice(i,i+500));if(error)throw error;bar.value=Math.round((i+500)/rows.length*95);st.textContent=`Aktarılıyor: ${Math.min(i+500,rows.length)} / ${rows.length}`}st.textContent='Toplamlar doğrulanıyor…';const {data:r,error:ce}=await sb.rpc('commit_ledger_import',{p_batch:batch.id,p_expected_rows:rows.length,p_expected_debit:debit});if(ce)throw ce;bar.value=100;await loadBase();st.className='status '+(Number(r.difference)===0?'ok':'err');st.textContent=`${r.rows} hareket aktarıldı. Daire bakiyesi ${money(r.apartment_closing)}, açılış bakiyesi farkı ${money(r.difference)}.`;$('#preview').innerHTML='<button class="btn" id="done">Özete git</button>';$('#done').onclick=()=>go('ozet')}catch(e){fail(e.message||'Bilinmeyen hata.')}}
boot().catch(e=>{showLogin('Bağlantı kurulamadı: '+e.message)});
</script>
