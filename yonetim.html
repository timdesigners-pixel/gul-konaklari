function journalQuery(q,{sort,filter,search}){const like=s=>'%'+String(s).replace(/[\\%_,()]/g,'\\$&')+'%';for(const f of filter){if(f.field==='entry_date'){const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(f.value).trim());if(m)q=q.eq('entry_date',`${m[3]}-${m[2]}-${m[1]}`);else if(/^\d{4}$/.test(String(f.value).trim()))q=q.gte('entry_date',f.value+'-01-01').lte('entry_date',f.value+'-12-31')}else if(f.field==='debit'||f.field==='credit'){const m=/^(>=|<=|>|<|=)?\s*(\d+(?:[.,]\d+)?)$/.exec(String(f.value).trim());if(m){const n=m[2].replace(',','.');q=m[1]==='>'?q.gt(f.field,n):m[1]==='>='?q.gte(f.field,n):m[1]==='<'?q.lt(f.field,n):m[1]==='<='?q.lte(f.field,n):q.eq(f.field,n)}}else if(f.field==='source')q=q.eq('source',f.value);else q=q.ilike(f.field,like(f.value))}if(search){const s=like(search);q=q.or(`description.ilike.${s},account_name.ilike.${s},account_code.ilike.${s},journal_no.ilike.${s}`)}for(const s of sort)q=q.order(s.field,{ascending:s.dir==='asc'});if(!sort.length)q=q.order('entry_date',{ascending:false});return q.order('id')}

MODULES.relations={key:'daire-iliskileri',title:'Daire İlişkileri',desc:'Malik, kiracı ve sakin kayıtları. Aktiflik değişiklikleri portal daire erişimine otomatik yansır.',store:{...relBase,load:async()=>{await loadContactMeta();return relBase.load()}},columns:[col.text('Daire','_apartment',{groupable:true,minWidth:80,sorter:'alphanum'}),col.text('Kişi','_contact',{minWidth:180}),col.badge('İlişki','relation_type',{Malik:['Malik','info'],'Kiracı':['Kiracı','warn'],Sakin:['Sakin','']},{groupable:true}),col.text('Yakınlık','relation_detail',{groupable:true}),col.text('Kayıtlı olduğu','registered_under',{groupable:true,visible:false}),col.date('Başlangıç','start_date'),col.date('Bitiş','end_date'),col.bool('Aktif','is_active',{edit:'check',groupable:true}),col.bool('İkamet','resides',{edit:'check',groupable:true})],fields:[{name:'apartment_id',label:'Daire',type:'select',required:true,options:aptOptions},{name:'contact_id',label:'Kişi',type:'select',required:true,options:()=>contactMeta.contacts.filter(c=>c.contact_type==='Şahıs').map(c=>({value:c.id,label:c.name}))},{name:'relation_type',label:'İlişki',type:'select',required:true,options:['Malik','Kiracı','Sakin'].map(x=>({value:x,label:x}))},{name:'relation_detail',label:'Yakınlık'},{name:'registered_under',label:'Kayıtlı olduğu',type:'select',options:['Malik','Kiracı'].map(x=>({value:x,label:x}))},{name:'start_date',label:'Başlangıç',type:'date'},{name:'end_date',label:'Bitiş',type:'date'},{name:'is_active',label:'Aktif',type:'check',default:true},{name:'resides',label:'İkamet',type:'check',hint:'Dairede oturuyor'}],defaults:{is_active:true,relation_type:'Sakin'},bulk:[{label:'Aktif yap',patch:{is_active:true}},{label:'Pasife al',patch:()=>({is_active:false,end_date:new Date().toISOString().slice(0,10)})}]};
const NAV=[['Genel',[['dashboard','Genel Bakış','home']]],['Site',[['balances','Daire Bakiyeleri','flat'],['contacts','Kişiler','team'],['relations','Daire İlişkileri','board'],['vehicles','Araçlar','car'],['tickets','Talepler','ticket'],['board','Yönetim Kurulu','board']]],['Finans',[['journal','Yevmiye','book'],['trial','Mizan','scale'],['budgets','Bütçeler','budget'],['accounting','Fiş ve Aktarım','list']]],['İletişim',[['decisions','Kararlar','doc'],['notifications','Bildirimler','bell'],['reminders','Hatırlatmalar','clock']]],['Web Sitesi',[['content','Sayfa İçeriği','edit'],['announcements','Duyurular','news'],['gallery','Galeri','image'],['team','Ekip','team'],['versions','Sürüm Geçmişi','history']]],['Sistem',[['integrations','Entegrasyonlar','plug'],['activity','İşlem Kaydı','log']]]];
const TITLES=Object.fromEntries(NAV.flatMap(g=>g[1]).map(x=>[x[0],x[1]]));
function paintNav(){$('#nav').innerHTML=NAV.map(([g,items])=>`<div class="navgroup"><span>${g}</span>${items.map(([k,t,ic])=>`<button class="navbtn" data-go="${k}">${icon(ic)}${t}<em class="hidden" data-count="${k}"></em></button>`).join('')}</div>`).join('')}
async function refreshCounts(){try{const now=new Date().toISOString();const [t,r,d]=await Promise.all([sb.from('support_tickets').select('id',{count:'exact',head:true}).neq('status','closed'),sb.from('reminders').select('id',{count:'exact',head:true}).eq('status','open').lt('due_at',now),sb.from('decisions').select('id',{count:'exact',head:true}).eq('status','draft')]);const set=(k,n,hot)=>{const e=$(`[data-count=${k}]`);if(!e)return;e.textContent=n||'';e.classList.toggle('hidden',!n);e.classList.toggle('hot',!!hot)};set('tickets',t.count);set('reminders',r.count,true);set('decisions',d.count)}catch(e){}}
function route(key,arg){current=key;grid=null;document.querySelectorAll('[data-go]').forEach(b=>b.dataset.go===key?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));$('#title').textContent=TITLES[key]||'';document.title=`${TITLES[key]||'Yönetim'} | Gül Konakları`;$('#side').classList.remove('open');try{history.replaceState(null,'','#'+key)}catch(e){}content.innerHTML='';if(key==='dashboard')return viewDashboard();if(key==='accounting'){content.innerHTML=`<iframe class="frame" title="Fiş ve aktarım" src="/muhasebe.html?embed=1${arg?`&account=${encodeURIComponent(arg)}`:''}"></iframe>`;return}if(key==='content')return viewContent();if(key==='versions')return viewVersions();if(key==='integrations')return viewIntegrations();const m=MODULES[key];if(!m)return route('dashboard');content.innerHTML=`<p class="lead">${esc(m.desc||'')}</p><div id="gridhost"></div>`;grid=createGrid($('#gridhost'),m)}

async function viewDashboard(){content.innerHTML='<p class="empty">Özet yükleniyor…</p>';try{const now=new Date().toISOString();const [acc,tk,rem,veh,dec,act]=await Promise.all([fetchAll(()=>sb.from('ledger_trial_balance').select('main_code,balance,apartment_id')),sb.from('support_tickets').select('ticket_no,subject,opened_at,status').neq('status','closed').order('opened_at',{ascending:false}).limit(6),sb.from('reminders').select('title,due_at').eq('status','open').order('due_at').limit(6),sb.from('vehicles').select('is_former,pts_enabled,is_active'),sb.from('decisions').select('id',{count:'exact',head:true}).eq('status','draft'),sb.from('admin_activity').select('table_name,action,created_at').order('created_at',{ascending:false}).limit(6)]);const s=(...c)=>acc.filter(a=>c.includes(a.main_code)).reduce((t,a)=>t+Number(a.balance),0);const debt=new Map();acc.filter(a=>a.main_code==='134'&&a.apartment_id).forEach(a=>debt.set(a.apartment_id,(debt.get(a.apartment_id)||0)+Number(a.balance)));const debtors=[...debt.values()].filter(v=>v>0.004).length,v=veh.data||[],former=v.filter(x=>x.is_former&&x.pts_enabled).length,late=(rem.data||[]).filter(r=>r.due_at<now).length;const kpi=(l,val,k,bad)=>`<button class="kpi ${bad?'bad':''}" data-go="${k}"><small>${l}</small><b>${val}</b></button>`;const act2={INSERT:'eklendi',UPDATE:'güncellendi',DELETE:'silindi'};content.innerHTML=`<div class="kpis">${kpi('Kasa ve banka (TL)',money(s('100','102','109')),'trial')}${kpi('Daire alacağı (TL)',money(s('134')),'balances')}${kpi('Borçlu daire',debtors,'balances',debtors>0)}${kpi('Açık talep',tk.data?.length===6?'6+':tk.data?.length||0,'tickets',(tk.data?.length||0)>0)}${kpi('Kayıtlı araç',v.length,'vehicles')}${kpi('PTS açık eski kayıt',former,'vehicles',former>0)}${kpi('Geciken hatırlatma',late,'reminders',late>0)}${kpi('Taslak karar',dec.count||0,'decisions')}</div><div class="cols"><section class="card"><h2>Açık talepler</h2><ul class="list">${(tk.data||[]).map(t=>`<li><span>#${t.ticket_no} ${esc(t.subject)}</span><small>${trDate(t.opened_at)}</small></li>`).join('')||'<li class="empty">Açık talep yok.</li>'}</ul></section><section class="card"><h2>Yaklaşan hatırlatmalar</h2><ul class="list">${(rem.data||[]).map(r=>`<li><span>${esc(r.title)}</span><small class="${r.due_at<now?'debt':''}">${esc(trDateTime(r.due_at))}</small></li>`).join('')||'<li class="empty">Açık hatırlatma yok.</li>'}</ul></section><section class="card"><h2>Son işlemler</h2><ul class="list">${(act.data||[]).map(a=>`<li><span>${esc(TABLE_NAMES[a.table_name]||a.table_name)} ${act2[a.action]||''}</span><small>${esc(trDateTime(a.created_at))}</small></li>`).join('')||'<li class="empty">Henüz işlem yok.</li>'}</ul></section></div>`}catch(e){content.innerHTML=`<p class="debt">Özet yüklenemedi: ${esc(e.message)}</p>`}}
async function viewContent(){content.innerHTML='<p class="empty">İçerik yükleniyor…</p>';try{const pl=must(await sb.from('site_content').select('payload').eq('id','homepage').single()).payload||{};const f=[['intro','Tanıtım metni','textarea'],['history','Site tarihçesi','textarea'],['address','Açık adres','text'],['management_phone','Yönetim telefonu','tel'],['security_phone','Güvenlik telefonu','tel']];content.innerHTML=`<p class="lead">Kaydedilen içerik ana sayfada hemen yayınlanır. Önceki hali Sürüm Geçmişi'ne eklenir.</p><form class="card" id="cf"><div class="formgrid">${f.map(([k,l,t])=>`<label class="field ${t==='textarea'?'':''}">${l}${t==='textarea'?`<textarea id="c_${k}" maxlength="6000" style="min-height:190px">${esc(pl[k])}</textarea>`:`<input id="c_${k}" type="${t}" maxlength="200" value="${esc(pl[k])}">`}</label>`).join('')}</div><p><button class="btn pri">Yayınla</button></p></form>`;$('#cf').onsubmit=async e=>{e.preventDefault();const b=$('#cf .pri');b.disabled=true;try{const latest=must(await sb.from('site_content').select('payload').eq('id','homepage').single()).payload||{};const next={...latest};f.forEach(([k])=>next[k]=$('#c_'+k).value.trim());must(await sb.from('site_content').update({payload:next,updated_at:new Date().toISOString()}).eq('id','homepage'));toast('İçerik yayınlandı.')}catch(x){toast(x.message,true)}b.disabled=false}}catch(e){content.innerHTML=`<p class="debt">İçerik yüklenemedi: ${esc(e.message)}</p>`}}
function viewVersions(){const m={key:'surumler',title:'Sürüm Geçmişi',readonly:true,store:{load:async()=>must(await sb.from('content_versions').select('*').eq('content_id','homepage').order('created_at',{ascending:false}).limit(200)).map(v=>({id:v.id,created_at:v.created_at,payload:v.payload,intro:v.payload?.intro||'',ann:(v.payload?.announcements||[]).length,gal:(v.payload?.gallery||[]).length}))},columns:[col.time('Kayıt zamanı','created_at'),col.long('Tanıtım metni','intro'),col.num('Duyuru','ann'),col.num('Galeri','gal')],rowActions:[{label:'Geri yükle',run:async(d,api)=>{if(!await ask('Ana sayfa içeriği bu sürüme döndürülsün mü? Mevcut hali de geçmişe kaydedilir.','Geri yükle'))return;must(await sb.from('site_content').update({payload:d.payload,updated_at:new Date().toISOString()}).eq('id','homepage'));toast('Sürüm geri yüklendi.');await api.reload()}}]};content.innerHTML='<p class="lead">Her içerik değişikliğinden önceki hal saklanır.</p><div id="gridhost"></div>';grid=createGrid($('#gridhost'),m)}
function viewIntegrations(){const rows=[['Supabase veri tabanı','Bağlı','Tüm modüller ve yetkilendirme',1],['Medya depolama','Bağlı','Galeri ve ekip görselleri',1],['Vercel yayın','Bağlı','main dalından otomatik yayın',1],['Portal içi bildirim','Bağlı','Portala bağlı kullanıcılara gönderim',1],['Bulutyönetim muavin aktarımı','Dosya ile','Toplu Muavin Excel içe aktarımı',1],['SMS sağlayıcısı','Bağlı değil','Sağlayıcı hesabı ve API bilgisi gerekir',0],['E-posta sağlayıcısı','Bağlı değil','Gönderici alan adı ve API bilgisi gerekir',0],['Sanal POS','Bağlı değil','Sipay üye işyeri bilgileri gerekir',0],['Banka mutabakatı','Bağlı değil','Banka API veya ekstre formatı gerekir',0],['Plaka tanıma (PTS)','Kayıt düzeyinde','Araç listesi tutulur, cihazla canlı bağlantı yok',0],['Yaya geçiş sistemi','Bağlı değil','Cihaz sağlayıcısının API bilgisi gerekir',0]];content.innerHTML=`<p class="lead">Harici sistemlerin gerçek bağlantı durumu.</p><div class="card"><ul class="list">${rows.map(r=>`<li><span><b>${esc(r[0])}</b><br><small style="white-space:normal">${esc(r[2])}</small></span><span class="${r[3]?'status-ok':'status-no'}">${esc(r[1])}</span></li>`).join('')}</ul></div>`}

function showLogin(msg=''){$('#login').classList.remove('hidden');$('#shell').classList.add('hidden');$('#login-err').textContent=msg}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return showLogin();const {data:roles,error}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).is('revoked_at',null).in('role',['manager','accounting']);if(error||!roles?.length){await sb.auth.signOut();return showLogin('Bu hesapta yönetim yetkisi bulunamadı.')}$('#login').classList.add('hidden');$('#shell').classList.remove('hidden');$('#who').textContent=session.user.email||'';const list=await fetchAll(()=>sb.from('apartments').select('id,block,apartment_no').neq('block','TEST').order('block').order('apartment_no'));apartments=list.sort((a,b)=>a.block.localeCompare(b.block,'tr')||Number(a.apartment_no)-Number(b.apartment_no));aptById=new Map(apartments.map(a=>[a.id,`${a.block}/${a.apartment_no}`]));paintNav();refreshCounts();const h=location.hash.slice(1);route(TITLES[h]?h:'dashboard')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)route(b.dataset.go)});
$('#menu').onclick=e=>{e.stopPropagation();$('#side').classList.toggle('open')};
$('#login-form').onsubmit=async e=>{e.preventDefault();$('#login-err').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#password').value='';if(error)return showLogin('Giriş başarısız. Bilgilerinizi kontrol edin.');await boot()};
$('#logout').onclick=async()=>{await sb.auth.signOut();content.innerHTML='';showLogin()};
boot().catch(e=>showLogin('Bağlantı kurulamadı: '+e.message));
</script>
